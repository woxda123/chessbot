<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Chess Board</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <style>
        body { background: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #board { width: 92vw; max-width: 380px; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .status-box { font-size: 16px; margin-bottom: 15px; background: #1e1e1e; padding: 10px 20px; border-radius: 20px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="status-box" id="status">Загрузка партии...</div>
    <div id="board"></div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Открываем приложение на весь экран телефона
        tg.ready();

        const game = new Chess();
        let board = null;

        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;
            // Игрок может ходить только за белых в этом тесте
            if (piece.search(/^b/) !== -1) return false;
        }

        function onDrop(source, target) {
            let move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Авто-превращение в ферзя для простоты
            });

            if (move === null) return 'snapback'; // Если ход не по правилам — фигура летит назад
            updateStatus();
            
            // Ответ ИИ через 800 миллисекунд
            window.setTimeout(makeBotMove, 800);
        }

        function makeBotMove() {
            let possibleMoves = game.moves();
            if (game.game_over()) return;

            let randomIdx = Math.floor(Math.random() * possibleMoves.length);
            game.move(possibleMoves[randomIdx]);
            board.position(game.fen());
            updateStatus();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function updateStatus() {
            let statusText = '';
            let moveColor = game.turn() === 'b' ? 'Черные' : 'Белые';

            if (game.in_checkmate()) { statusText = `🏳️ Мат! Победили ${game.turn() === 'b' ? 'Белые' : 'Черные'}`; }
            else if (game.in_draw()) { statusText = '🤝 Ничья!'; }
            else {
                statusText = `Ход: ${moveColor === 'Белые' ? '⚪ Твой ход' : '⚫ Думает бот...'}`;
                if (game.in_check()) { statusText += ' ⚠️ ШАХ!'; }
            }
            document.getElementById('status').innerText = statusText;
        }

        const config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboard-js.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = ChessBoard('board', config);
        updateStatus();
    </script>
</body>
</html>
